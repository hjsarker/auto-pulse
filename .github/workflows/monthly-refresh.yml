name: Auto Pulse — monthly data refresh

on:
  schedule:
    - cron: '17 8 1 * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-pulse-monthly
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh official data, validate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out independent repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the previously published snapshot
        run: |
          python -m pytest -q
          python -m pipeline.global_ev
          python -m pipeline.main --offline
      - name: Check and refresh international EV market data
        id: global
        continue-on-error: true
        run: python -m pipeline.global_ev --refresh
      - name: Check and refresh official German auto figures
        id: germany
        continue-on-error: true
        run: python -m pipeline.main
      - name: Revalidate and rebuild publication files
        run: |
          python -m pytest -q
          python -m pipeline.global_ev
          python -m pipeline.main --offline
          python build_standalone.py
      - name: Save actual source-check outcomes
        env:
          GLOBAL_OUTCOME: ${{ steps.global.outcome }}
          GERMANY_OUTCOME: ${{ steps.germany.outcome }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          data = {
            "last_attempt_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
            "international_source_check": os.environ["GLOBAL_OUTCOME"],
            "germany_source_check": os.environ["GERMANY_OUTCOME"],
            "description": "Missing or blocked official source data leaves the last verified figures unchanged."
          }
          Path("data/refresh_status.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Publish verified changes to the independent repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/global.json data/global_analytics.csv data/market.json data/registration_analytics.csv data/refresh_status.json web/global.json web/market.json deploy-index.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified Auto Pulse snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failures of official sources
        if: ${{ steps.global.outcome == 'failure' || steps.germany.outcome == 'failure' }}
        run: |
          echo '::error::At least one official source check failed. Last verified data is retained for that source.'
          exit 1
